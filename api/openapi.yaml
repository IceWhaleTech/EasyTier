openapi: 3.0.3

info:
  title: ZimaOS EasyTier Meshtier API
  version: v1
  license:
    name: LGPL-3.0-or-later
    url: https://www.gnu.org/licenses/lgpl-3.0.html
  description: |
    API definition for routes implemented in `easytier-web/src/restful/meshtier.rs`.
    Only live `/mt/*` routes are included.

servers:
  - url: /mt
    description: Meshtier route prefix

tags:
  - name: meshtier
    description: Meshtier lifecycle operations

security:
  - bearer_token: []
  - query_token: []

paths:
  /ping:
    get:
      summary: Ping meshtier API
      operationId: pingMeshtier
      tags: [meshtier]
      parameters:
        - $ref: '#/components/parameters/user_id_header'
        - $ref: '#/components/parameters/x_user_id_header'
      responses:
        '200':
          description: Pong response
          content:
            text/plain:
              schema:
                type: string
                example: pong
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /info:
    get:
      summary: Get mesh info
      operationId: getMeshInfo
      tags: [meshtier]
      parameters:
        - $ref: '#/components/parameters/user_id_header'
        - $ref: '#/components/parameters/x_user_id_header'
      responses:
        '200':
          $ref: '#/components/responses/MeshResponseOK'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /status:
    put:
      summary: Set mesh status
      operationId: setMeshStatus
      tags: [meshtier]
      parameters:
        - $ref: '#/components/parameters/user_id_header'
        - $ref: '#/components/parameters/x_user_id_header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeshStatusRequest'
      responses:
        '200':
          $ref: '#/components/responses/MeshResponseOK'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /connect:
    post:
      summary: Connect mesh
      operationId: connectMesh
      tags: [meshtier]
      parameters:
        - $ref: '#/components/parameters/user_id_header'
        - $ref: '#/components/parameters/x_user_id_header'
      responses:
        '200':
          $ref: '#/components/responses/MeshResponseOK'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /disconnect:
    post:
      summary: Disconnect mesh
      operationId: disconnectMesh
      tags: [meshtier]
      parameters:
        - $ref: '#/components/parameters/user_id_header'
        - $ref: '#/components/parameters/x_user_id_header'
      responses:
        '200':
          $ref: '#/components/responses/MeshResponseOK'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

components:
  securitySchemes:
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
    query_token:
      type: apiKey
      in: query
      name: token

  parameters:
    user_id_header:
      name: user_id
      in: header
      required: false
      description: Optional user id forwarded by gateway.
      schema:
        type: integer
        format: int32
        example: 1
    x_user_id_header:
      name: x-user-id
      in: header
      required: false
      description: Optional user id forwarded by gateway.
      schema:
        type: integer
        format: int32
        example: 1

  schemas:
    MeshStatus:
      type: string
      enum: [online, offline, reset]

    MeshStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/MeshStatus'

    MeshResponse:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          example: 1c978a12d05588af
        name:
          type: string
          example: IceWhale-RemoteAccess
        status:
          $ref: '#/components/schemas/MeshStatus'
        ip:
          type: string
          nullable: true
          example: 10.243.0.1

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: missing Authorization header and token query parameter

  responses:
    MeshResponseOK:
      description: Successful mesh response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MeshResponse'

    UnauthorizedResponse:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerErrorResponse:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
