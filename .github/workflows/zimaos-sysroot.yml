name: Build ZimaOS Sysroot

on:
  workflow_dispatch:
    inputs:
      target_triple:
        description: "Rust target triple"
        required: true
        default: "x86_64-unknown-linux-gnu"
      web_features:
        description: "Features for easytier-web build"
        required: true
        default: "embed"
      core_features:
        description: "Features for easytier-core build (optional)"
        required: true
        default: ""

  push:
    branches: ["develop", "main", "mt"]
    tags:
      - "zimaos-sysroot-v*"

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build-sysroot:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend assets for embed
        uses: ./.github/actions/prepare-pnpm
        with:
          build_filter: "./easytier-web/*"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ""
          shared-key: "zimaos-sysroot"

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust target
        run: |
          bash ./.github/workflows/install_rust.sh
          TARGET_TRIPLE="${{ github.event.inputs.target_triple || 'x86_64-unknown-linux-gnu' }}"
          rustup target add "$TARGET_TRIPLE"

      - name: Build sysroot
        env:
          TARGET_TRIPLE: ${{ github.event.inputs.target_triple || 'x86_64-unknown-linux-gnu' }}
          WEB_CARGO_FEATURES: ${{ github.event.inputs.web_features || 'embed' }}
          CORE_CARGO_FEATURES: ${{ github.event.inputs.core_features || '' }}
        run: bash ./script/build_zimaos_sysroot.sh

      - name: Show artifact layout
        run: |
          ls -laR build/sysroot

      - name: Pack sysroot
        env:
          TARGET_TRIPLE: ${{ github.event.inputs.target_triple || 'x86_64-unknown-linux-gnu' }}
        run: |
          mkdir -p dist
          tar -C build -czf "dist/zimaos-sysroot-${TARGET_TRIPLE}.tar.gz" sysroot
          sha256sum "dist/zimaos-sysroot-${TARGET_TRIPLE}.tar.gz" > "dist/zimaos-sysroot-${TARGET_TRIPLE}.tar.gz.sha256"

      - name: Upload sysroot artifact
        uses: actions/upload-artifact@v4
        with:
          name: zimaos-sysroot-${{ github.event.inputs.target_triple || 'x86_64-unknown-linux-gnu' }}
          path: |
            build/sysroot/**

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: zimaos-sysroot-package-${{ github.event.inputs.target_triple || 'x86_64-unknown-linux-gnu' }}
          path: |
            dist/zimaos-sysroot-*.tar.gz
            dist/zimaos-sysroot-*.tar.gz.sha256

  publish-release:
    needs: build-sysroot
    if: startsWith(github.ref, 'refs/tags/zimaos-sysroot-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: zimaos-sysroot-package-${{ github.event.inputs.target_triple || 'x86_64-unknown-linux-gnu' }}
          path: release_assets

      - name: Generate custom release notes
        env:
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          PREV_TAG="$(git tag --list 'zimaos-sysroot-v*' --sort=-version:refname | grep -Fxv "$TAG_NAME" | head -n1 || true)"

          {
            echo "## ZimaOS Sysroot Release"
            echo
            echo "- Tag: \`$TAG_NAME\`"
            echo "- Commit: [\`${COMMIT_SHA:0:7}\`](https://github.com/$REPO/commit/$COMMIT_SHA)"
            echo "- Workflow Run: [#$RUN_ID](https://github.com/$REPO/actions/runs/$RUN_ID)"
            echo
            echo "### Assets"
            echo
            echo "| File | Size | SHA256 |"
            echo "| --- | ---: | --- |"
            for pkg in release_assets/*.tar.gz; do
              [ -f "$pkg" ] || continue
              base="$(basename "$pkg")"
              size="$(du -h "$pkg" | awk '{print $1}')"
              sha="$(cut -d ' ' -f1 "release_assets/${base}.sha256")"
              echo "| \`$base\` | \`$size\` | \`$sha\` |"
            done
            echo
            echo "<details>"
            echo "<summary>Verify Package Integrity</summary>"
            echo
            echo '```bash'
            echo "sha256sum -c zimaos-sysroot-*.tar.gz.sha256"
            echo '```'
            echo
            echo "</details>"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "### Changes Since \`$PREV_TAG\`"
              echo
              git log --no-merges --pretty='- %s (%h)' "$PREV_TAG..$COMMIT_SHA" | sed '/^$/d'
            else
              echo "### Initial Release"
              echo
              echo "- First public release of ZimaOS sysroot package."
            fi
          } > release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ZimaOS Sysroot ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            release_assets/*
