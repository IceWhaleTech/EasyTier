name: EasyTier Release

on:
  workflow_dispatch:
    inputs:
      core_run_id:
        description: "The run id of EasyTier Core in this repository"
        type: number
        required: true
      gui_run_id:
        description: "The run id of EasyTier GUI in this repository"
        type: number
        required: true
      mobile_run_id:
        description: "The run id of EasyTier Mobile in this repository"
        type: number
        required: true
      version:
        description: "Version for this release"
        type: string
        default: "v2.5.0"
        required: true
      make_latest:
        description: "Mark this release as latest"
        type: boolean
        default: true
        required: true
  workflow_run:
    workflows: ["EasyTier Core", "EasyTier GUI", "EasyTier Mobile"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || inputs.version || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve_runs:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'dev')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.resolve.outputs.ready }}
      core_run_id: ${{ steps.resolve.outputs.core_run_id }}
      gui_run_id: ${{ steps.resolve.outputs.gui_run_id }}
      mobile_run_id: ${{ steps.resolve.outputs.mobile_run_id }}
      version: ${{ steps.resolve.outputs.version }}
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
    steps:
      - name: Resolve workflow runs
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "core_run_id=${{ inputs.core_run_id }}" >> "$GITHUB_OUTPUT"
            echo "gui_run_id=${{ inputs.gui_run_id }}" >> "$GITHUB_OUTPUT"
            echo "mobile_run_id=${{ inputs.mobile_run_id }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "artifact_name=easytier-release-${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${HEAD_SHA::7}"
          RUNS_JSON="$(gh api "/repos/${{ github.repository }}/actions/runs?event=push&branch=dev&head_sha=${HEAD_SHA}&per_page=100")"

          core_run_id="$(echo "$RUNS_JSON" | jq -r '.workflow_runs | map(select(.name == "EasyTier Core" and .status == "completed" and .conclusion == "success")) | sort_by(.created_at) | last | .id // empty')"
          gui_run_id="$(echo "$RUNS_JSON" | jq -r '.workflow_runs | map(select(.name == "EasyTier GUI" and .status == "completed" and .conclusion == "success")) | sort_by(.created_at) | last | .id // empty')"
          mobile_run_id="$(echo "$RUNS_JSON" | jq -r '.workflow_runs | map(select(.name == "EasyTier Mobile" and .status == "completed" and .conclusion == "success")) | sort_by(.created_at) | last | .id // empty')"

          if [[ -z "$core_run_id" || -z "$gui_run_id" || -z "$mobile_run_id" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "version=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "artifact_name=easytier-release-dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "core_run_id=${core_run_id}" >> "$GITHUB_OUTPUT"
          echo "gui_run_id=${gui_run_id}" >> "$GITHUB_OUTPUT"
          echo "mobile_run_id=${mobile_run_id}" >> "$GITHUB_OUTPUT"
          echo "version=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=easytier-release-dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve_runs
    if: needs.resolve_runs.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Core Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ needs.resolve_runs.outputs.core_run_id }}
          repo: ${{ github.repository }}
          path: release_assets

      - name: Download GUI Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ needs.resolve_runs.outputs.gui_run_id }}
          repo: ${{ github.repository }}
          path: release_assets_nozip

      - name: Download Mobile Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ needs.resolve_runs.outputs.mobile_run_id }}
          repo: ${{ github.repository }}
          path: release_assets_nozip

      - name: Zip release assets
        env:
          VERSION: ${{ needs.resolve_runs.outputs.version }}
        run: |
          mkdir zipped_assets

          find release_assets_nozip -type f -exec mv {} zipped_assets \;
          ls -l -R ./zipped_assets

          cd release_assets
          ls -l -R ./
          chmod -R 755 .
          for x in *; do
            if [[ "$x" == "Easytier-Magisk" ]]; then
              # Keep Magisk files at the root of the zip archive.
              (
                cd "$x"
                zip -r "../../zipped_assets/$x-${VERSION}.zip" .
              )
            else
              zip -r "../zipped_assets/$x-${VERSION}.zip" "$x"
            fi
          done

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve_runs.outputs.artifact_name }}
          path: ./zipped_assets/*
          retention-days: 7
          if-no-files-found: error

      - name: Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.resolve_runs.outputs.version }}
          draft: true
          files: |
            ./zipped_assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.resolve_runs.outputs.version }}
          make_latest: ${{ inputs.make_latest && 'true' || 'false' }}
